<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ver configuración - PCBuild</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="shortcut icon" th:href="@{/media/small1.svg}" type="image/x-icon">
</head>

<body>

    <header>
        <div class="container1">
            <div>
                <a th:href="@{/menu}">
                    <img th:src="@{/media/full1.svg}" alt="pcbuild_logo" width="150px">
                </a>
            </div>
        </div>
        <div class="logoutt">
            <a href="/cerrarSesion">Cerrar Sesión</a>
        </div>
    </header>

    <main>
        <div class="conf_pc" style="padding-bottom: 40px;">
            <div class="info_conf">
                <div class="config_top">
                    <span class="config_name" th:text="${configuracion.nombre}"></span>
                    <span class="config_fecha" th:text="${configuracion.fechacreacion}"></span>
                </div>

                <form th:action="@{/configuracion/actualizar-productos}" method="post">
                    <input type="hidden" name="idconfiguracion" th:value="${configuracion.idconfiguracion}">

                    <div class="config_body">

                        <div th:each="cat : ${categorias}">
                            <label class="reg-txt" th:text="${cat} + ':'"></label>

                            <select class="input-reg" th:name="${cat}">
                                <option value="">No seleccionado</option>
                                <th:block th:each="prod : ${porCategoria.get(cat)}">
                                    <option th:value="${prod.nombre}"
                                            th:text="${prod.nombre} + ' - ' + ${prod.marca} + ' - ' + ${prod.precio} + '€'"
                                            th:selected="${seleccionados.get(cat) != null && seleccionados.get(cat).nombre == prod.nombre}">
                                    </option>
                                </th:block>
                            </select>
                        </div>

                    </div>

                    <div class="config_bottom">
                        <button class="btn_conf" type="submit">Guardar configuración</button>
                        <a th:href="@{/menu}" class="btn_delete">Cancelar</a>
                    </div>

                </form>
            </div>

            <div class="conf_actions">
                <a th:href="@{/configuracion/exportar/{id}(id=${configuracion.idconfiguracion})}" class="btn_add">
                    Exportar a .txt
                </a>
            </div>
        </div>
    </main>

    <footer style="margin-top: 30px;">
        <div class="containerfooter">
            <div><span class="spanfooter">2026</span></div>
            <div><span class="spanfooter">PCBuild©</span></div>
            <a href="https://github.com/pabhb2-bnnuy">
                <div>
                    <img th:src="@{/media/github.svg}" alt="github_logo" width="20px">
                </div>
            </a>
        </div>
    </footer>

</body>

</html>
