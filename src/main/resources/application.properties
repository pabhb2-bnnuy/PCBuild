spring.application.name=build
spring.devtools.restart.enabled=true
spring.thymeleaf.cache=false


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.url=${SQL_URL}
spring.datasource.username=${SQL_USER}
spring.datasource.password=${SQL_PASS}

#Para testeo sin docker
#spring.datasource.username=root
#spring.datasource.password=toor
#spring.datasource.url=jdbc:mysql://localhost:3306/pcbuild


#Seguridad contra Cross site Scripting, XSS (JavaScript)
server.servlet.session.cookie.http-only=true

